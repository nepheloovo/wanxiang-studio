<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>万象工场</title>
<meta name="description" content="万象工场：AIGC 内容生产平台。一句话输入，AI 逐步生成剧本、分镜、画面与视频，每一步由你定稿。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400&family=Manrope:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--u:min(calc(100vw/1600),calc(100vh/900));--cream:#f5efe2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{color:var(--cream);font-family:Manrope,"Noto Sans SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#valley{position:fixed;inset:0}
.js-canvas-container{position:absolute;inset:0}
.js-canvas-container canvas{display:block;width:100%!important;height:100%!important}
.lil-gui{display:none!important}
.ui{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1.6s ease}
.ui.on{opacity:1}
.ui a,.ui button{pointer-events:auto}
header{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(24*var(--u)) calc(44*var(--u)) 0}
.logo{font-size:calc(26*var(--u));font-weight:500;letter-spacing:-.02em}
nav{display:flex;align-items:center;gap:calc(44*var(--u));font-size:calc(14.5*var(--u));font-weight:500;letter-spacing:.16em;text-transform:uppercase}
nav a:not(.pill){transition:opacity .2s}nav a:not(.pill):hover{opacity:.6}
.pill{display:inline-flex;align-items:center;height:calc(46*var(--u));padding:0 calc(26*var(--u));border-radius:99px;background:var(--cream);color:#151510;transition:transform .25s}
.pill:hover{transform:translateY(-1px)}
.hero{position:absolute;left:0;right:0;top:50%;transform:translateY(-46%);display:flex;flex-direction:column;align-items:center;text-align:center}
h1{font:400 calc(158*var(--u))/.92 Antonio,"Arial Narrow","Noto Sans SC",sans-serif;letter-spacing:-.012em;white-space:nowrap}
h1 span{display:inline-block}
.cap{margin-top:calc(48*var(--u));font-size:calc(20*var(--u));line-height:1.3}
.go{display:grid;place-items:center;margin-top:calc(34*var(--u));width:calc(58*var(--u));height:calc(58*var(--u));border:1.5px solid var(--cream);border-radius:50%;transition:background .3s,color .3s}
.go:hover{background:var(--cream);color:#151510}
.go svg{width:calc(22*var(--u));height:calc(22*var(--u));fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.corner{position:absolute;right:calc(44*var(--u));bottom:calc(44*var(--u));display:flex;align-items:center;gap:calc(18*var(--u));font-size:calc(12.5*var(--u));font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.corner i{width:1px;height:calc(26*var(--u));background:rgba(245,239,226,.45)}
.sound{display:grid;place-items:center;width:calc(28*var(--u));height:calc(28*var(--u))}
.sound svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sound .w{transition:opacity .3s}.sound[aria-pressed=false] .w{opacity:0}
.sound[aria-pressed=true] .x{opacity:0}
.loader{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:#000;transition:opacity 1s ease;pointer-events:none}
.loader.gone{opacity:0}
.loader span{width:calc(9*var(--u));height:calc(9*var(--u));min-width:6px;min-height:6px;border-radius:50%;background:var(--cream);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.4);opacity:.4}}
a:focus-visible,button:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
@media (max-width:820px){
  :root{--u:1px}
  header{padding:18px 18px 0}
  nav a:not(.pill){display:none}
  .pill{height:40px;padding:0 18px;font-size:12px}
  .hero{left:20px;right:20px}
  .corner{left:20px;justify-content:center}
  h1{font-size:clamp(56px,16.5vw,96px);white-space:normal}
  h1 span{white-space:nowrap}
  .cap{font-size:17px}
  .corner{right:20px;bottom:30px;font-size:11px}
}
@media (prefers-reduced-motion:reduce){.loader span{animation:none}}
</style>

<body>
<div id="valley" aria-hidden="true"><div class="js-canvas-container"></div></div>
<div class="ui" id="ui">
  <header>
    <a class="logo" href="#" aria-label="万象工场">万象工场</a>
    <nav aria-label="主导航"><a href="#">场景</a><a href="#">流程</a><a href="#">模型</a><a class="pill" href="http://localhost:3001">开始创作</a></nav>
  </header>
  <section class="hero">
    <h1><span>一句话，</span><span>万象成片。</span></h1>
    <p class="cap">剧本、分镜、画面、视频，AI 一步步生成。<br>每一步，都由你定稿。</p>
    <a class="go" href="http://localhost:3001" id="go" aria-label="开始创作"><svg viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a>
  </section>
  <div class="corner"><span>滚动探索</span><i></i>
    <button class="sound" id="sound" aria-pressed="false" aria-label="环境音"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5Z"/><path class="w" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="m16 10 4 4m0-4-4 4"/></svg></button>
  </div>
</div>
<div class="loader" id="loader"><span></span></div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
// 万象工场 night flower valley — an original three.js engine exposing the same
// interface the page expects: new Valley(el, onLoaded, onIntroDone),
// startHoverTransition(), stopHoverTransition(), and an audio store with
// initAudio() / toggleMute() / isInitialized.
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ---------------- ambient audio (synthesised, starts muted) ---------------- */
const A = { ctx: null, master: null, filter: null, isInitialized: false, muted: true };
const audioApi = {
  get isInitialized() { return A.isInitialized; },
  initAudio() {
    if (A.isInitialized) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const master = ctx.createGain(); master.gain.value = 0;
    const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 2400; filter.Q.value = .4;
    filter.connect(master); master.connect(ctx.destination);
    [[98, 'sine', .07, -4], [146.8, 'sine', .05, 5], [196, 'triangle', .02, -7], [293.7, 'sine', .012, 3]].forEach(([f, type, g, det]) => {
      const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = det;
      const gain = ctx.createGain(); gain.gain.value = g;
      const lfo = ctx.createOscillator(); lfo.frequency.value = .05 + Math.random() * .08;
      const lfoGain = ctx.createGain(); lfoGain.gain.value = g * .45;
      lfo.connect(lfoGain).connect(gain.gain);
      o.connect(gain).connect(filter); o.start(); lfo.start();
    });
    // soft wind: filtered noise
    const len = ctx.sampleRate * 4, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    let last = 0; for (let i = 0; i < len; i++) { last = (last + .02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.2; }
    const noise = ctx.createBufferSource(); noise.buffer = buf; noise.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 520; bp.Q.value = .6;
    const ng = ctx.createGain(); ng.gain.value = .05;
    noise.connect(bp).connect(ng).connect(filter); noise.start();
    Object.assign(A, { ctx, master, filter, isInitialized: true });
  },
  toggleMute() {
    if (!A.isInitialized) return A.muted;
    if (A.ctx.state === 'suspended') A.ctx.resume();
    A.muted = !A.muted;
    const t = A.ctx.currentTime, g = A.master.gain;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(A.muted ? 0 : .22, t + 1.2);
    return A.muted;
  },
  setMuffle(v) {
    if (!A.isInitialized) return;
    A.filter.frequency.setTargetAtTime(2400 - v * 2050, A.ctx.currentTime, .15);
  }
};
const audioStore = () => audioApi;

/* ---------------- terrain + path ---------------- */
const heightAt = (x, z) =>
  2.4 * Math.sin(x * .045 + z * .021) + 1.8 * Math.sin(z * .037 + 1.3) + .9 * Math.sin((x - z) * .09) + .0009 * x * x;

let seed = 20251106;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2831853 * v); };

class Valley {
  constructor(container, onLoaded, onIntroDone) {
    this.onLoaded = onLoaded; this.onIntroDone = onIntroDone;
    this.hoverTarget = 0; this.disperse = 0;
    const mount = container.querySelector('.js-canvas-container') || container;
    try {
      this.renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    } catch (e) { onLoaded(); onIntroDone(); return; }
    const r = this.renderer;
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    r.setPixelRatio(this.dpr); r.setSize(innerWidth, innerHeight);
    mount.appendChild(r.domElement);

    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x000000);
    this.camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, .1, 600);

    const pts = [];
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.cos(a) * 80 + Math.sin(a * 3) * 14, 0, Math.sin(a) * 250));
    }
    this.path = new THREE.CatmullRomCurve3(pts, true, 'centripetal');

    this.buildGround();
    this.buildField();
    this.buildRays();
    this.buildDust();
    this.buildPost();

    this.mouse = new THREE.Vector2(0, 0); this.mouseT = new THREE.Vector2(0, 0);
    this.cur = 0; this.target = 0; this.prev = 0; this.speed = 0;
    this.start = performance.now(); this.last = this.start; this.loaded = false;

    addEventListener('pointermove', e => this.mouseT.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight * 2 - 1)));
    addEventListener('wheel', e => { if (this.hoverTarget) return; this.target += e.deltaY * 0.00004; }, { passive: true });
    let ty = null;
    addEventListener('touchstart', e => { ty = e.touches[0]?.clientY ?? null; }, { passive: true });
    addEventListener('touchmove', e => {
      if (ty === null || this.hoverTarget || !e.touches[0]) return;
      const y = e.touches[0].clientY; this.target += (ty - y) * 0.000002 * 20; ty = y;
    }, { passive: true });
    addEventListener('touchend', () => { ty = null; }, { passive: true });
    addEventListener('resize', () => this.resize());
    this.reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.tick = this.tick.bind(this);
    requestAnimationFrame(this.tick);
  }

  buildGround() {
    const g = new THREE.PlaneGeometry(360, 640, 120, 220); g.rotateX(-Math.PI / 2);
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) p.setY(i, heightAt(p.getX(i), p.getZ(i)) - .4);
    g.computeVertexNormals();
    this.groundMat = new THREE.ShaderMaterial({
      uniforms: { uCam: { value: new THREE.Vector3() } },
      vertexShader: `varying vec3 vW; varying vec3 vN; void main(){ vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; vN=normal; gl_Position=projectionMatrix*viewMatrix*w; }`,
      fragmentShader: `uniform vec3 uCam; varying vec3 vW; varying vec3 vN;
        void main(){ float d=distance(vW,uCam); float fog=exp(-d*d*.0002);
          float lit=.35+.65*max(dot(normalize(vN),normalize(vec3(.2,1.,.3))),0.);
          vec3 c=vec3(.0045,.005,.0038)*lit; gl_FragColor=vec4(c*fog,1.); }`
    });
    this.scene.add(new THREE.Mesh(g, this.groundMat));
  }

  buildField() {
    const nF = 15000, nL = 9000, n = nF + nL;
    const pos = new Float32Array(n * 3), col = new Float32Array(n * 3), size = new Float32Array(n), sd = new Float32Array(n), type = new Float32Array(n);
    const palette = [[1, .95, .86], [1, .86, .6], [1, .8, .82], [.98, .9, .78], [.88, .84, 1]];
    const weights = [.34, .26, .2, .14, .06];
    const pick = () => { let x = rnd(), i = 0; while (x > weights[i] && i < weights.length - 1) { x -= weights[i]; i++; } return palette[i]; };
    const tmp = new THREE.Vector3(), tan = new THREE.Vector3();
    for (let i = 0; i < n; i++) {
      const leaf = i >= nF;
      let x, z;
      if (rnd() < .85) {
        const t = rnd(); this.path.getPointAt(t, tmp); this.path.getTangentAt(t, tan);
        const off = gauss() * (leaf ? 30 : 22);
        x = tmp.x - tan.z * off; z = tmp.z + tan.x * off;
      } else { x = (rnd() - .5) * 340; z = (rnd() - .5) * 620; }
      const y = heightAt(x, z) + (leaf ? .1 + rnd() * .5 : .35 + rnd() * 1.3);
      pos.set([x, y, z], i * 3);
      const c = leaf ? [.32 + rnd() * .08, .4 + rnd() * .08, .3] : pick();
      col.set(c, i * 3);
      size[i] = leaf ? .9 + rnd() * .9 : (rnd() < .07 ? 1.5 + rnd() * .7 : .55 + rnd() * .75);
      sd[i] = rnd(); type[i] = leaf ? 1 : 0;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
    g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
    g.setAttribute('aSeed', new THREE.BufferAttribute(sd, 1));
    g.setAttribute('aType', new THREE.BufferAttribute(type, 1));
    this.fieldMat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 }, uCam: { value: new THREE.Vector3() }, uMouse: { value: new THREE.Vector2(9, 9) },
        uAspect: { value: innerWidth / innerHeight }, uScale: { value: 210 * this.dpr }, uDisperse: { value: 0 }
      },
      vertexShader: `
        uniform float uTime, uAspect, uScale, uDisperse; uniform vec3 uCam; uniform vec2 uMouse;
        attribute vec3 aColor; attribute float aSize, aSeed, aType;
        varying vec3 vColor; varying float vAlpha, vGlow, vSeed, vType, vCore;
        void main(){
          vec3 p = position;
          float d = distance(p, uCam);
          // flowers bloom as they approach; leaves grow in further back
          float grow = aType < .5 ? smoothstep(75., 12., d) : smoothstep(170., 55., d);
          float g = uDisperse * uDisperse * (3. - 2. * uDisperse);
          vec3 dir = normalize(vec3(sin(aSeed * 91.7), .55 + fract(aSeed * 13.1), cos(aSeed * 57.3)));
          p += dir * g * (5. + fract(aSeed * 7.7) * 16.);
          p.y += sin(uTime * .7 + aSeed * 40.) * g * 1.4;
          vec4 mv = modelViewMatrix * vec4(p, 1.);
          vec4 clip = projectionMatrix * mv;
          vec2 ndc = clip.xy / clip.w;
          vec2 dm = (ndc - uMouse) * vec2(uAspect, 1.);
          float md = length(dm);
          float push = exp(-md * md * 9.);
          ndc += (dm / max(md, 1e-4)) / vec2(uAspect, 1.) * push * .07;
          clip.xy = ndc * clip.w;
          gl_Position = clip;
          float s = aSize * mix(aType < .5 ? .12 : .2, 1., grow) * mix(1., .4, g);
          gl_PointSize = clamp(s * uScale / max(-mv.z, .5), 0., 64.);
          vGlow = push * (aType < .5 ? 1. : .4) + g * .9;
          vAlpha = exp(-d * d * .000045) * smoothstep(.8, 5., -mv.z) * (aType < .5 ? 1. : .5);
          vColor = aColor; vSeed = aSeed; vType = aType; vCore = g;
        }`,
      fragmentShader: `
        varying vec3 vColor; varying float vAlpha, vGlow, vSeed, vType, vCore;
        void main(){
          vec2 c = gl_PointCoord * 2. - 1.;
          float r = length(c);
          float alpha; vec3 col;
          if (vType < .5) {
            float a = atan(c.y, c.x) + vSeed * 6.2831;
            float petal = .42 + .38 * pow(abs(cos(2.5 * a)), .7);
            float body = 1. - smoothstep(petal - .16, petal, r);
            float core = 1. - smoothstep(0., .26, r);
            // when dispersed, flowers soften into round glowing motes
            float mote = exp(-r * r * 7.);
            body = mix(body, mote, vCore);
            col = mix(vColor * .85, vec3(1., .94, .78), core * (1. - vCore));
            col *= 1. + vGlow * 2.4;
            alpha = (body * .9 + exp(-r * 3.2) * .25) * vAlpha;
          } else {
            float a = vSeed * 6.2831;
            vec2 q = mat2(cos(a), -sin(a), sin(a), cos(a)) * c;
            float e = length(q * vec2(1., 2.7));
            alpha = (1. - smoothstep(.55, .9, e)) * vAlpha * .7;
            col = vColor * (1. + vGlow * 1.5);
          }
          if (alpha < .01) discard;
          gl_FragColor = vec4(col, alpha);
        }`,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    });
    this.scene.add(new THREE.Points(g, this.fieldMat));
  }

  buildRays() {
    const cv = document.createElement('canvas'); cv.width = 64; cv.height = 256;
    const x = cv.getContext('2d');
    const gr = x.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, 'rgba(255,240,215,0)'); gr.addColorStop(.35, 'rgba(255,240,215,.55)'); gr.addColorStop(1, 'rgba(255,240,215,0)');
    x.fillStyle = gr; x.fillRect(0, 0, 64, 256);
    const gh = x.createLinearGradient(0, 0, 64, 0);
    gh.addColorStop(0, 'rgba(0,0,0,1)'); gh.addColorStop(.5, 'rgba(0,0,0,0)'); gh.addColorStop(1, 'rgba(0,0,0,1)');
    x.globalCompositeOperation = 'destination-out'; x.fillStyle = gh; x.fillRect(0, 0, 64, 256);
    const tex = new THREE.CanvasTexture(cv);
    this.rays = [];
    const p = new THREE.Vector3();
    for (let i = 0; i < 14; i++) {
      const m = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: .018 + rnd() * .022, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
      const s = new THREE.Sprite(m);
      this.path.getPointAt(i / 14 + rnd() * .03, p);
      s.position.set(p.x + (rnd() - .5) * 60, heightAt(p.x, p.z) + 22 + rnd() * 10, p.z + (rnd() - .5) * 30);
      s.scale.set(10 + rnd() * 10, 70 + rnd() * 30, 1);
      m.rotation = (rnd() - .5) * .35;
      this.scene.add(s); this.rays.push(s);
    }
  }

  buildDust() {
    const n = 900, pos = new Float32Array(n * 3), sd = new Float32Array(n);
    for (let i = 0; i < n; i++) { pos.set([(rnd() - .5) * 300, rnd() * 28, (rnd() - .5) * 600], i * 3); sd[i] = rnd(); }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('aSeed', new THREE.BufferAttribute(sd, 1));
    this.dustMat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uScale: { value: 60 * this.dpr }, uCam: { value: new THREE.Vector3() } },
      vertexShader: `uniform float uTime, uScale; uniform vec3 uCam; attribute float aSeed; varying float vA;
        void main(){ vec3 p = position;
          p.x += sin(uTime * .07 + aSeed * 30.) * 3.; p.z += cos(uTime * .05 + aSeed * 20.) * 3.;
          p.y += mod(uTime * .25 + aSeed * 28., 28.) * .25 + heightOffset();
          vec4 mv = modelViewMatrix * vec4(p, 1.); gl_Position = projectionMatrix * mv;
          gl_PointSize = uScale * (.4 + aSeed) / max(-mv.z, 1.);
          vA = exp(-pow(distance(p, uCam), 2.) * .00012) * (.3 + .4 * sin(uTime * .9 + aSeed * 50.) * .5 + .2); }`.replace('heightOffset()', '0.'),
      fragmentShader: `varying float vA; void main(){ float r = length(gl_PointCoord * 2. - 1.); float a = exp(-r * r * 5.) * vA; if (a < .01) discard; gl_FragColor = vec4(1., .95, .85, a); }`,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    });
    this.scene.add(new THREE.Points(g, this.dustMat));
  }

  buildPost() {
    const c = this.composer = new EffectComposer(this.renderer);
    c.addPass(new RenderPass(this.scene, this.camera));
    this.bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .75, .45, .32);
    c.addPass(this.bloom);
    c.addPass(new OutputPass());
    this.final = new ShaderPass({
      uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uSplit: { value: .0015 }, uVig: { value: 0 } },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
      fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime, uSplit, uVig; varying vec2 vUv;
        void main(){ vec2 d = vUv - .5;
          vec3 col = vec3(texture2D(tDiffuse, vUv + d * uSplit).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - d * uSplit).b);
          float n = fract(sin(dot(vUv * (uTime + 1.), vec2(12.9898, 78.233))) * 43758.5453);
          col += (n - .5) * .03;
          float r = length(d * vec2(1.1, 1.));
          col *= 1. - smoothstep(.62 - uVig * .22, .95 - uVig * .3, r) * .9;
          gl_FragColor = vec4(col, 1.); }`
    });
    c.addPass(this.final);
  }

  resize() {
    if (!this.renderer) return;
    const w = innerWidth, h = innerHeight;
    this.camera.aspect = w / h; this.camera.updateProjectionMatrix();
    this.renderer.setSize(w, h); this.composer.setSize(w, h); this.bloom.setSize(w, h);
    this.fieldMat.uniforms.uAspect.value = w / h;
  }

  startHoverTransition() { this.hoverTarget = 1; }
  stopHoverTransition() { this.hoverTarget = 0; }

  tick(now) {
    requestAnimationFrame(this.tick);
    if (document.hidden) { this.last = now; return; }
    const dt = Math.min(.05, (now - this.last) / 1000 || .016); this.last = now;
    const t = now / 1000;

    // hover: ease the flight to a stop and disperse the flowers
    this.disperse += (this.hoverTarget - this.disperse) * (1 - Math.exp(-dt * 2.2));
    audioApi.setMuffle(this.disperse);

    // virtual scroller + slow idle drift
    if (!this.reduce) this.target += dt * .0032 * (1 - this.disperse);
    if (this.hoverTarget) this.target += (this.cur - this.target) * (1 - Math.exp(-dt * 3));
    this.cur += (this.target - this.cur) * (1 - Math.exp(-dt * 2.6));
    const v = (this.cur - this.prev) / dt; this.prev = this.cur;
    this.speed += (Math.abs(v) - this.speed) * (1 - Math.exp(-dt * 4));
    const fast = Math.min(1, Math.max(0, (this.speed - .004) * 40));

    // camera along the path, with a slow intro descent
    const intro = Math.min(1, (now - this.start) / 3200), ie = 1 - Math.pow(1 - intro, 3);
    const u = ((this.cur % 1) + 1) % 1, ua = (((this.cur + .018) % 1) + 1) % 1;
    const p = this.path.getPointAt(u), a = this.path.getPointAt(ua);
    const cam = this.camera;
    cam.position.set(p.x, heightAt(p.x, p.z) + 4.2 + (1 - ie) * 26, p.z);
    cam.lookAt(a.x, heightAt(a.x, a.z) + 2.4 - (1 - ie) * 6, a.z);
    this.mouse.x += (this.mouseT.x - this.mouse.x) * (1 - Math.exp(-dt * 2));
    this.mouse.y += (this.mouseT.y - this.mouse.y) * (1 - Math.exp(-dt * 2));
    cam.rotateY(-this.mouse.x * .035); cam.rotateX(this.mouse.y * .02);

    const fu = this.fieldMat.uniforms;
    fu.uTime.value = t; fu.uCam.value.copy(cam.position); fu.uDisperse.value = this.disperse;
    fu.uMouse.value.copy(this.mouseT.lengthSq() ? this.mouse : new THREE.Vector2(9, 9));
    this.groundMat.uniforms.uCam.value.copy(cam.position);
    this.dustMat.uniforms.uTime.value = t; this.dustMat.uniforms.uCam.value.copy(cam.position);
    this.final.uniforms.uTime.value = t;
    this.final.uniforms.uVig.value = fast;
    this.final.uniforms.uSplit.value = .0015 + fast * .006;
    this.bloom.strength = .75 + this.disperse * .3;

    this.composer.render();
    if (!this.loaded) { this.loaded = true; this.onLoaded(); }
    if (intro >= 1) this.onIntroDone();
  }
}

window.__GE = { et: () => Valley, Y: () => audioStore };
</script>
<script type="module">
// boot the flower valley
const Valley=window.__GE.et(),audioStore=window.__GE.Y();
let introShown=false;
const valley=new Valley(document.getElementById('valley'),
  ()=>document.getElementById('loader').classList.add('gone'),
  ()=>{if(!introShown){introShown=true;document.getElementById('ui').classList.add('on')}});
audioStore().initAudio();
const sound=document.getElementById('sound');
sound.onclick=()=>{const s=audioStore();if(!s.isInitialized)return;const muted=s.toggleMute();sound.setAttribute('aria-pressed',String(!muted))};
// hovering the arrow eases the camera to a stop and muffles the sound
const go=document.getElementById('go');
go.addEventListener('pointerenter',()=>valley.startHoverTransition());
go.addEventListener('pointerleave',()=>valley.stopHoverTransition());
</script>
